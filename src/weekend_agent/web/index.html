<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周末去哪玩</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<header><div><span class="eyebrow">把周末留给喜欢的事</span><h1>周末去哪玩</h1><p>选好兴趣、时间和预算，排一份轻松的一日安排。</p></div><span class="badge">教学演示 · 地点与费用均为虚构</span></header>
<main>
<section class="card"><h2>这次想怎么过？</h2><form id="trip-form">
<div class="row"><label>城市<input value="杭州" readonly></label><label>出行日期<input id="travel_date" type="date" value="2026-11-21" required></label></div>
<div class="row"><label>每人预算（元）<input id="budget" type="number" min="0" max="10000" step="0.01" value="200" required></label><label>同行人数<input id="group" type="number" min="1" max="20" value="2" required></label></div>
<div class="row"><label>开始时间<input id="start" type="time" value="10:00" required></label><label>结束时间<input id="end" type="time" value="18:00" required></label></div>
<label>兴趣（用逗号分开）<input id="tags" value="拍照，美食" placeholder="拍照、文化、自然、美食"></label>
<div class="row"><label>室内外偏好<select id="indoor"><option value="any">都可以</option><option value="inside">室内</option><option value="outside">户外</option></select></label><label>运行方式<select id="mode"><option value="demo">离线演示</option><option value="live">真实模型（需配置）</option></select></label></div>
<div class="checks"><label><input id="rain" type="checkbox">模拟雨天</label><label><input id="meal" type="checkbox" checked>安排用餐</label></div>
<label>补充要求<textarea id="question" rows="2" maxlength="2000" placeholder="真实模型模式下，可补充自然语言要求"></textarea></label>
<p class="hint">离线演示按表单生成，不理解补充要求。真实模型模式也使用同一套虚构地点资料。</p>
<p id="model-status" class="hint">正在检查模型配置……</p>
<div class="actions"><button id="generate" type="submit">生成我的安排</button><button type="button" id="reset" class="secondary">新建会话</button></div>
</form><p id="status" role="status" aria-live="polite">准备好就出发。</p></section>
<section class="card result"><div class="result-heading"><h2>你的周末安排</h2><span id="plan-status" class="badge">等待生成</span></div>
<div id="summary" class="summary">修改预算或切换雨天后再次生成，可以比较两份安排。</div>
<div id="schedule"></div><div id="citations"></div><details><summary>查看生成过程</summary><div id="trace"></div></details>
<p class="hint">费用仅含地点价格和相邻地点交通，不含往返起点交通及其他消费。请勿据此安排真实旅行。</p>
</section></main>
<footer>一份有依据、能检查、可修改的小计划。</footer>
</body></html>
